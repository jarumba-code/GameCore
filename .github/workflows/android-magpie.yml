name: Android Magpie Android build

on:
  push:
    branches: [feature/android-magpie, diagnostic/vulkan-failure-investigation]
  pull_request:
    branches: [feature/android-magpie, diagnostic/vulkan-failure-investigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-magpie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, test, and package (API 35 / arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAGPIE_NDK_VERSION: 26.1.10909125
      MAGPIE_CMAKE_VERSION: 3.22.1

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and pinned native tools
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Export pinned NDK path
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$MAGPIE_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$MAGPIE_NDK_VERSION" >> "$GITHUB_ENV"
          test -f "$SDK_ROOT/ndk/$MAGPIE_NDK_VERSION/build/cmake/android.toolchain.cmake"
          "$SDK_ROOT/cmake/$MAGPIE_CMAKE_VERSION/bin/cmake" --version
          "$SDK_ROOT/ndk/$MAGPIE_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Install GLSL front-end for shader compilation
        run: |
          # The NDK stopped shipping glslc (r25+). glslangValidator (apt glslang-tools) compiles
          # the same GLSL to the same Vulkan 1.0 SPIR-V; the shaders declare the include
          # directive extension it requires, and the CMake build prefers glslc when one exists.
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          glslangValidator --version | head -2
          spirv-val --version | head -1

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run standalone FSR 1 CPU reference fixtures
        shell: bash
        run: |
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmake/$MAGPIE_CMAKE_VERSION/bin/cmake" \
            -S tools/fsr1-reference -B "$RUNNER_TEMP/fsr1-reference" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$RUNNER_TEMP/android-magpie-fsr-reference-configure.log"
          "$ANDROID_SDK_ROOT/cmake/$MAGPIE_CMAKE_VERSION/bin/cmake" --build "$RUNNER_TEMP/fsr1-reference" \
            2>&1 | tee "$RUNNER_TEMP/android-magpie-fsr-reference-build.log"
          "$ANDROID_SDK_ROOT/cmake/$MAGPIE_CMAKE_VERSION/bin/ctest" \
            --test-dir "$RUNNER_TEMP/fsr1-reference" --output-on-failure \
            2>&1 | tee "$RUNNER_TEMP/android-magpie-fsr-reference-test.log"

      - name: Run JVM tests and build Android test APKs, debug APK, and the layer test app
        id: gradle-build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            :plugin-studio:testDebugUnitTest \
            :plugin-maker:testDebugUnitTest \
            :gamecore-plugin-sdk:test \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :layer-test-app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/android-magpie-gradle-build.log"

      - name: Diagnose layer-test-app shader generation and Ninja dependency graph
        id: shader-diagnosis
        if: always()
        shell: bash
        run: |
          set -o pipefail
          echo "=== Layer-test-app CMake build diagnostics ==="

          # Find all CMake build directories using null-delimited discovery
          BUILD_DIR_COUNT=0
          while IFS= read -r -d '' ninja_file; do
            CMAKE_BUILD_DIR="${ninja_file%/build.ninja}"
            BUILD_DIR_COUNT=$((BUILD_DIR_COUNT + 1))
            echo "CMake build directory: $CMAKE_BUILD_DIR"

            # List all targets
            echo ""
            echo "=== All Ninja targets ==="
            ninja -C "$CMAKE_BUILD_DIR" -t targets all 2>&1 | tee -a "$RUNNER_TEMP/layer-test-ninja-targets.log"
            NINJA_TARGETS_EXIT=${PIPESTATUS[0]}
            echo "ninja -t targets exit code: $NINJA_TARGETS_EXIT"

            # Query magpie_test_shaders target
            echo ""
            echo "=== magpie_test_shaders target dependency graph ==="
            ninja -C "$CMAKE_BUILD_DIR" -t query magpie_test_shaders 2>&1 | tee -a "$RUNNER_TEMP/layer-test-magpie-test-shaders-deps.log"
            NINJA_QUERY_EXIT=${PIPESTATUS[0]}
            echo "ninja -t query magpie_test_shaders exit code: $NINJA_QUERY_EXIT"

            # Show commands that would run for shader target
            echo ""
            echo "=== Commands for shader generation ==="
            ninja -C "$CMAKE_BUILD_DIR" -t commands magpie_test_shaders 2>&1 | tee -a "$RUNNER_TEMP/layer-test-shader-commands.log"
            NINJA_COMMANDS_EXIT=${PIPESTATUS[0]}
            echo "ninja -t commands magpie_test_shaders exit code: $NINJA_COMMANDS_EXIT"

            # Check for shader outputs using null-delimited discovery
            echo ""
            echo "=== Shader output files (should exist after build) ==="
            for f in test_vert.spv test_frag.spv easu.spv rcas.spv test_shaders.h magpie_shaders.h; do
              echo "  Checking for $f:"
              FOUND_COUNT=0
              while IFS= read -r -d '' FOUND; do
                FOUND_COUNT=$((FOUND_COUNT + 1))
                SIZE=$(stat -c%s "$FOUND" 2>/dev/null || stat -f%z "$FOUND" 2>/dev/null)
                echo "    FOUND: $FOUND (size: $SIZE bytes)"
              done < <(find "$CMAKE_BUILD_DIR" -name "$f" -type f -print0 2>/dev/null)
              if [ "$FOUND_COUNT" -eq 0 ]; then
                echo "    NOT FOUND"
              fi
            done

            # Check Ninja rules for shader generation
            echo ""
            echo "=== Ninja rules containing shader ==="
            echo "  === Build directory: $CMAKE_BUILD_DIR ===" >> "$RUNNER_TEMP/layer-test-ninja-rules.log"
            grep -n "test_vert\|test_frag\|easu\|rcas\|test_shaders\|magpie_shaders" \
              "$CMAKE_BUILD_DIR/build.ninja" >> "$RUNNER_TEMP/layer-test-ninja-rules.log" 2>/dev/null
            GREP_EXIT=$?
            echo "" >> "$RUNNER_TEMP/layer-test-ninja-rules.log"
            sed -n '1,20p' "$RUNNER_TEMP/layer-test-ninja-rules.log"
            echo "Grep exit code: $GREP_EXIT (0 = rules found)"
            echo ""
          done < <(find layer-test-app/.cxx -type f -name build.ninja -print0 2>/dev/null)

          echo "Total build directories found: $BUILD_DIR_COUNT"
          if [ "$BUILD_DIR_COUNT" -eq 0 ]; then
            echo "ERROR: layer-test-app CMake build directories not found"
            exit 1
          fi

          # Validate SPIR-V magic in native libraries
          echo ""
          echo "=== SPIR-V validation in native libraries ==="
          for so in libVkLayer_MagpieFSR.so libmagpie_test_renderer.so; do
            if [ -f "layer-test-app/build/intermediates/cmake/debug/obj/arm64-v8a/$so" ]; then
              LIBRARY="layer-test-app/build/intermediates/cmake/debug/obj/arm64-v8a/$so"
              MAGIC_COUNT=$(xxd -p -c 4 "$LIBRARY" | grep -c '^03022307$' || true)
              echo "  $so: $MAGIC_COUNT SPIR-V magic occurrences"
              if [ "$MAGIC_COUNT" -eq 0 ] && [[ "$so" == *"layer"* ]]; then
                echo "  WARNING: No shader data in layer library - this indicates missing shader embedding!"
              fi
            fi
          done

          # Run spirv-val on generated shaders
          echo ""
          echo "=== SPIR-V validation with spirv-val ==="
          SHADER_DIR_GLOB=$(find layer-test-app/.cxx -name "shaders" -type d -print -quit 2>/dev/null || echo "")
          if [ -n "$SHADER_DIR_GLOB" ]; then
            for spv in test_vert.spv test_frag.spv easu.spv rcas.spv; do
              FOUND=$(find . -path "$SHADER_DIR_GLOB" -name "$spv" -type f -print -quit 2>/dev/null)
              if [ -n "$FOUND" ]; then
                echo "Validating $spv:"
                spirv-val "$FOUND" || echo "SPIR-V validation FAILED for $spv"
              else
                echo "WARNING: $spv not found for validation"
              fi
            done
          else
            echo "WARNING: Shader directory not found for spirv-val"
          fi

          # Check layer-test APK exists
          if [ -f "layer-test-app/build/outputs/apk/debug/layer-test-app-debug.apk" ]; then
            echo ""
            echo "=== Extracting native libraries from APK for deeper inspection ==="
            mkdir -p apk-extracted
            cd apk-extracted
            unzip -o ../layer-test-app/build/outputs/apk/debug/layer-test-app-debug.apk \
              lib/arm64-v8a/libVkLayer_MagpieFSR.so lib/arm64-v8a/libmagpie_test_renderer.so 2>/dev/null

            for so in libVkLayer_MagpieFSR.so libmagpie_test_renderer.so; do
              if [ -f "$so" ]; then
                MAGIC=$(xxd -p -c 4 "$so" | grep -c '^03022307$' || true)
                echo "  $so from APK: $MAGIC SPIR-V magic bytes"

                if [ "$MAGIC" -eq 0 ]; then
                  echo "  ERROR: $so has no embedded shader data!"
                  echo "  Checking for shader symbols:"
                  nm -C "$so" 2>/dev/null | grep -E "kEasuSpv|kRcasSpv|kVertSpv|kFragSpv" || echo "    No shader symbols found"
                fi
              fi
            done
            cd ..
          fi

      - name: Verify native library outputs and APK packaging
        id: package-check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import struct
          import zipfile

          root = pathlib.Path("app/build")
          generated = root / "generated/magpie/jniLibs/arm64-v8a"
          apk = root / "outputs/apk/debug/app-debug.apk"
          names = (
              "libmagpie_core.so",
              "libmagpie_fsr.so",
              "libmagpie_vulkan.so",
              "libmagpie_gles.so",
              "libmagpie_android_jni.so",
              "libc++_shared.so",
          )
          for name in names:
              path = generated / name
              data = path.read_bytes()
              if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
                  raise SystemExit(f"{path}: expected little-endian ELF64")
              machine = struct.unpack_from("<H", data, 18)[0]
              if machine != 183:
                  raise SystemExit(f"{path}: expected AArch64 (183), got {machine}")
              print(f"Generated AArch64 ELF64: {path}")

          if not apk.is_file():
              raise SystemExit(f"APK is missing: {apk}")
          with zipfile.ZipFile(apk) as archive:
              entries = set(archive.namelist())
              for name in names:
                  entry = f"lib/arm64-v8a/{name}"
                  if entry not in entries:
                      raise SystemExit(f"APK missing {entry}")
                  data = archive.read(entry)
                  if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
                      raise SystemExit(f"APK entry {entry} is not ELF64")
                  machine = struct.unpack_from("<H", data, 18)[0]
                  if machine != 183:
                      raise SystemExit(f"APK entry {entry} is not AArch64 (e_machine={machine})")
                  print(f"APK contains AArch64 library: {entry} ({len(data)} bytes)")
          print(f"APK: {apk} ({apk.stat().st_size} bytes)")
          PY

          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          PACKAGE="$($AAPT dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$PACKAGE" = "com.gamecore.debug"
          echo "Verified debug application ID: $PACKAGE"

          # Layer test app: the Vulkan layer .so and the renderer must both be packaged as
          # AArch64 ELFs — the loader finds libVkLayer_*.so in the app's own nativeLibraryDir.
          TEST_APK=layer-test-app/build/outputs/apk/debug/layer-test-app-debug.apk
          if [ ! -f "$TEST_APK" ]; then
              echo "layer-test APK is missing: $TEST_APK"; exit 1
          fi
          python3 - "$TEST_APK" <<'PY'
          import pathlib, struct, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as archive:
              entries = set(archive.namelist())
              for name in ("libVkLayer_MagpieFSR.so", "libmagpie_test_renderer.so", "libc++_shared.so"):
                  entry = f"lib/arm64-v8a/{name}"
                  if entry not in entries:
                      raise SystemExit(f"layer-test APK missing {entry}")
                  data = archive.read(entry)
                  if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
                      raise SystemExit(f"{entry} is not ELF64")
                  machine = struct.unpack_from("<H", data, 18)[0]
                  if machine != 183:
                      raise SystemExit(f"{entry} is not AArch64 (e_machine={machine})")
                  print(f"layer-test APK contains AArch64 library: {entry} ({len(data)} bytes)")
          print(f"layer-test APK: {apk} ({apk.stat().st_size} bytes)")
          PY
          TEST_PACKAGE="$($AAPT dump badging "$TEST_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$TEST_PACKAGE" = "com.gamecore.magpietest"
          echo "Verified layer-test application ID: $TEST_PACKAGE"

      - name: Collect build and test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          for log in android-magpie-gradle-build.log android-magpie-instrumented-tests.log android-magpie-fsr-reference-configure.log android-magpie-fsr-reference-build.log android-magpie-fsr-reference-test.log layer-test-ninja-targets.log layer-test-magpie-test-shaders-deps.log layer-test-shader-commands.log layer-test-ninja-rules.log; do
            if [ -f "$RUNNER_TEMP/$log" ]; then cp "$RUNNER_TEMP/$log" ci-diagnostics/; fi
          done
          for path in app/build/reports app/build/test-results app/build/outputs/logs app/.cxx layer-test-app/.cxx; do
            if [ -e "$path" ]; then mkdir -p "ci-diagnostics/$(dirname "$path")"; cp -R "$path" "ci-diagnostics/$(dirname "$path")/"; fi
          done
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=${GITHUB_REF_NAME}"
            java -version 2>&1
            ./gradlew --version 2>&1
          } > ci-diagnostics/build-environment.txt

      - name: Upload debug APK artifact
        if: always() && steps.package-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-magpie-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation test APK artifact
        if: always() && steps.package-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-magpie-android-test-apk-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload layer test APK artifact
        if: always() && steps.package-check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: magpie-layer-test-apk-${{ github.sha }}
          path: layer-test-app/build/outputs/apk/debug/layer-test-app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-magpie-build-diagnostics-${{ github.sha }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14
